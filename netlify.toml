[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/emails/send"
  to = "/.netlify/functions/emails-send"
  status = 200

[[redirects]]
  from = "/api/notifications/push"
  to = "/.netlify/functions/onesignal-push"
  status = 200

[[redirects]]
  from = "/api/admin/miembros/crear"
  to = "/.netlify/functions/admin-crear"
  status = 200

[[redirects]]
  from = "/api/admin/miembros/actualizar-auth"
  to = "/.netlify/functions/admin-actualizar-auth"
  status = 200

[[redirects]]
  from = "/api/admin/miembros/actualizar-password"
  to = "/.netlify/functions/admin-actualizar-password"
  status = 200

[[redirects]]
  from = "/*"
  status = 200
  to = "/index.html"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.onesignal.com https://onesignal.com https://*.onesignal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://onesignal.com https://*.onesignal.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.brevo.com https://api.cloudinary.com http://localhost:3001 https://*.onesignal.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
