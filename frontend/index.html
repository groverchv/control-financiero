<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport & Basic ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sistema institucional de la Asociación de Profesionales Financieros para control financiero, académico y patrimonial y gestión de socios." />
    <meta name="keywords" content="asociación de profesionales financieros, gestión socios, actividades académicas, patrimonio, apf" />
    <meta name="author" content="Asociación de Profesionales Financieros" />

    <!-- ── Theme Colors ── -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1e293b" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="msapplication-navbutton-color" content="#0f172a" />

    <!-- ── Open Graph (Facebook, WhatsApp, LinkedIn) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Asociación de Profesionales Financieros" />
    <meta property="og:description" content="Sistema institucional para control financiero, académico y patrimonial y gestión de socios." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:locale" content="es_BO" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Asociación de Profesionales Financieros" />
    <meta name="twitter:description" content="Sistema institucional para control financiero, académico y patrimonial." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- ── Icons ── -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- ── Performance: Preconnect to external origins ── -->
    <link rel="preconnect" href="https://tcyxikaxkoibrqmxoozq.supabase.co" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://a.tile.openstreetmap.org" />

    <title>Asociación de Profesionales Financieros</title>
  </head>
  <body>
    <div id="root">
      <style>
        body { margin: 0; background-color: #0f172a; }
        .splash-screen {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          color: #f8fafc;
        }
        .splash-spinner {
          width: 48px;
          height: 48px;
          border: 4px solid rgba(255, 255, 255, 0.1);
          border-left-color: #3b82f6;
          border-radius: 50%;
          animation: splash-spin 1s linear infinite;
          margin-bottom: 24px;
        }
        @keyframes splash-spin {
          to { transform: rotate(360deg); }
        }
        .splash-text {
          font-size: 14px;
          font-weight: 600;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #94a3b8;
          animation: splash-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes splash-pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: .5; }
        }
      </style>
      <div class="splash-screen">
        <div class="splash-spinner"></div>
        <div class="splash-text">Cargando APF...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
